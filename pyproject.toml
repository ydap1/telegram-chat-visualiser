[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "telegram-chat-visualiser"
version = "2.0.0"
description = "Analyse and visualise your Telegram chat exports"
requires-python = ">=3.8"
dependencies = [
    "matplotlib>=3.7",
    "nltk>=3.8",
    "wordcloud>=1.8",
    "networkx>=3.0",
    "vaderSentiment>=3.3",
    "tabulate>=0.9",
]

[project.scripts]
tcv = "tcv.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tcv*"]
